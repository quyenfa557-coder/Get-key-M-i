<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#1677ff">
  <title>Sent Get Key</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">◇</span>
      <span>S E N T K E Y</span>
    </div>

    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="container">
    <section class="welcome-card">
      <span>Welcome Friend</span>
      <button type="button" id="closeWelcome" aria-label="Đóng">×</button>
    </section>

    <section class="license-card">
      <div class="card-title">Create License</div>

      <div class="card-content">
        <div class="option-row">
          <div class="option-icon">🎮</div>
          <div class="option-value">Sent Tweaks</div>
          <div class="option-arrow">⌄</div>
        </div>

        <div class="option-row">
          <div class="option-icon">📱</div>
          <div class="option-value">1</div>
          <div class="option-addon">device</div>
        </div>

        <div class="option-row">
          <div class="option-icon">📅</div>
          <div class="option-value">1 Day</div>
          <div class="option-arrow">⌄</div>
        </div>

        <div class="option-row">
          <div class="option-icon">◇</div>
          <div class="option-value">FREE</div>
          <div class="option-arrow">⌄</div>
        </div>

        <p id="message" class="message" aria-live="polite"></p>

        <div class="generate-area">
          <button id="generateBtn" class="generate-button" type="button">
            <span>⇥</span>
            <span>Generate</span>
          </button>
        </div>
      </div>
    </section>

    <section id="result" class="result-card hidden">
      <div class="result-title">
        <span>License Generated</span>
        <span id="statusBadge" class="status-badge">ACTIVE</span>
      </div>

      <div class="key-box">
        <code id="keyValue">—</code>
      </div>

      <div class="result-info">
        <div>
          <span>Thời hạn</span>
          <strong id="planValue">24 giờ</strong>
        </div>

        <div>
          <span>Hết hạn</span>
          <strong id="expiresValue">—</strong>
        </div>
      </div>

      <button id="copyBtn" class="copy-button" type="button">
        Sao chép key
      </button>

      <p class="device-note">
        Key sẽ tự liên kết với thiết bị khi đăng nhập lần đầu trong ứng dụng.
      </p>
    </section>

    <footer>
      Secure License System
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
